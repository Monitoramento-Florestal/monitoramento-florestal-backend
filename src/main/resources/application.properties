# Nome do projeto e porta do servidor
spring.application.name=arbor
server.port=8080

# Perfil padrao para ambiente local (quando nenhum profile for informado).
# Em producao, sobrescreva com SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Configuracao de conexao com o banco PostGIS (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/arbor_db
spring.datasource.username=arbor_user
spring.datasource.password=arbor_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracao do JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Configuracao do SMTP (Precisa do email e da senha de app)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=Arbor@gmail.com
spring.mail.password=senha_de_app_arbor

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# jwt config (defina JWT_SECRET no ambiente para perfis sem override local)
# Observacao: o default vazio permite subir o contexto e emitir erro mais claro no JwtService.
jwt.secret=${JWT_SECRET:}
