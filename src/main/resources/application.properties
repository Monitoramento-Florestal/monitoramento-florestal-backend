# Nome do projeto e porta do servidor
spring.application.name=arbor
server.port=8080

# Configuração de conexão com o banco PostGIS (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/arbor_db
spring.datasource.username=arbor_user
spring.datasource.password=arbor_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O ddl-auto fica como validate porque o Flyway vai criar as tabelas
spring.jpa.hibernate.ddl-auto=validate

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration