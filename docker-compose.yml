version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3 # Imagem do Postgres já com a extensão espacial
    container_name: arbor_db
    environment:
      POSTGRES_DB: arbor_db
      POSTGRES_USER: arbor_user
      POSTGRES_PASSWORD: arbor_password
    ports:
      - "5432:5432" # Porta padrão do PostgreSQL
    volumes:
      - arbor_data:/var/lib/postgresql/data # Salva os dados para não perder ao desligar
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: arbor_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@arbor.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80" # Acessar o pgAdmin no navegador via localhost:5050
    depends_on:
      - db
    restart: unless-stopped

volumes:
  arbor_data: